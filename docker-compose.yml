# Sobe o embedding-reranking com tudo de que ele depende, a partir de um
# clone isolado deste repositório:
#
#   cp .env.example .env
#   docker compose up -d
#
# O embedding-reranking é construído do código local. As dependências vêm
# prontas:
#   - vector-db (+ ChromaDB): imagem do Docker Hub; é onde /index grava;
#   - authorization: construído direto do repositório no GitHub, porque a
#     imagem publicada dele só existe para arm64. Sem JWT_*_KEY_PATH ele gera
#     um par RSA temporário a cada subida (só para desenvolvimento).
#
# O modelo de embedding é baixado do Hugging Face no primeiro uso e fica no
# volume hf_cache, para não baixar de novo a cada restart.

x-depende-do-auth: &depende-do-auth
  authorization:
    condition: service_healthy

services:
  embedding-reranking:
    build: .
    restart: unless-stopped
    ports:
      - "8003:8003"
    env_file:
      - .env
    volumes:
      - hf_cache:/root/.cache/huggingface
    depends_on:
      <<: *depende-do-auth
      vector-db:
        condition: service_started

  vector-db:
    image: joao2006/vector-db:1.0.0
    restart: unless-stopped
    environment:
      AUTH_SERVICE_BASE_URL: http://authorization:8081
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
    depends_on:
      <<: *depende-do-auth
      chromadb:
        condition: service_healthy

  chromadb:
    image: chromadb/chroma:0.5.20
    restart: unless-stopped
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/api/v1/heartbeat"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # --- authorization: emite os tokens (login em http://localhost:8081) ---
  oracle-auth:
    image: gvenzl/oracle-free:23-slim
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: ganjj_auth
      APP_USER_PASSWORD: ganjj_auth
    volumes:
      - oracle_auth_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  authorization:
    build: https://github.com/Back-End-Cloud-Computing/authorization.git#main
    restart: unless-stopped
    depends_on:
      oracle-auth:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      DB_HOST: oracle-auth
      DB_PORT: 1521
      DB_NAME: FREEPDB1
      DB_USER: ganjj_auth
      DB_PASSWORD: ganjj_auth
      JPA_DDL_AUTO: update
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@ganjj.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-adminSegura123}
    ports:
      - "8081:8081"
    healthcheck:
      # A imagem não tem curl: faz o GET pelo /dev/tcp do bash e só considera
      # pronto quando /auth/public-key responde 200.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /auth/public-key HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  hf_cache:
  chroma_data:
  oracle_auth_data:
